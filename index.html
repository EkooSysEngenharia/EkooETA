<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ekoo ETA</title>

    <link rel="stylesheet" href="css/style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

    <main class="aplicativo">

        <header class="cabecalho">
            <button
                id="botaoVoltar"
                class="botao-voltar escondido"
                type="button"
                aria-label="Voltar"
            >
                ←
            </button>

            <div class="marca">
                <img
                    src="assets/logo.png"
                    alt="Logo Ekoo Sys Engenharia"
                    class="logo"
                >

                <div>
                    <h1 id="tituloTela">Ekoo ETA</h1>

                    <p id="subtituloTela">
                        Sistema de Monitoramento de Estações de Tratamento de Água
                    </p>
                </div>
            </div>
        </header>

        <section id="telaInicial" class="tela ativa">

            <button
                class="cartao-menu cartao-destaque"
                id="botaoNovaMedicao"
                type="button"
            >
                <span class="icone-menu">＋</span>

                <span class="texto-menu">
                    <strong>Nova medição</strong>
                    <small>Registrar uma nova análise da ETA</small>
                </span>
            </button>

            <button
                class="cartao-menu"
                id="botaoClientes"
                type="button"
            >
                <span class="icone-menu">🏢</span>

                <span class="texto-menu">
                    <strong>Clientes</strong>
                    <small>Cadastrar e consultar clientes</small>
                </span>
            </button>

            <button
                class="cartao-menu"
                id="botaoHistorico"
                type="button"
            >
                <span class="icone-menu">📋</span>

                <span class="texto-menu">
                    <strong>Histórico</strong>
                    <small>Consultar medições realizadas</small>
                </span>
            </button>

            <button
                class="cartao-menu"
                id="botaoRelatorios"
                type="button"
            >
                <span class="icone-menu">📄</span>

                <span class="texto-menu">
                    <strong>Relatórios</strong>
                    <small>Gerar planilhas e documentos</small>
                </span>
            </button>

        </section>

        <section id="telaClientes" class="tela">

            <div class="barra-acoes">
                <div class="campo-pesquisa">
                    <span>🔎</span>

                    <input
                        type="search"
                        id="pesquisaCliente"
                        placeholder="Pesquisar por nome, CPF ou CNPJ"
                    >
                </div>

                <button
                    id="botaoNovoCliente"
                    class="botao-principal"
                    type="button"
                >
                    ＋ Novo cliente
                </button>
            </div>

            <div id="mensagemSemClientes" class="mensagem-vazia">
                <div class="icone-vazio">🏢</div>

                <h2>Nenhum cliente cadastrado</h2>

                <p>
                    Cadastre o primeiro cliente para começar a registrar
                    ETAs e medições.
                </p>
            </div>

            <div id="listaClientes" class="lista-clientes"></div>

        </section>

        <section id="telaFormularioCliente" class="tela">

            <form id="formularioCliente" class="formulario">

                <input
                    type="hidden"
                    id="clienteId"
                >

                <div class="grupo-campo">
                    <label>Tipo de documento</label>

                    <div class="opcoes-documento">

                        <label class="opcao-radio">
                            <input
                                type="radio"
                                name="tipoDocumento"
                                value="CPF"
                                checked
                            >

                            <span>CPF</span>
                        </label>

                        <label class="opcao-radio">
                            <input
                                type="radio"
                                name="tipoDocumento"
                                value="CNPJ"
                            >

                            <span>CNPJ</span>
                        </label>

                    </div>
                </div>

                <div class="grupo-campo">
                    <label for="documentoCliente">
                        CPF ou CNPJ
                    </label>

                    <input
                        type="text"
                        id="documentoCliente"
                        inputmode="numeric"
                        autocomplete="off"
                        placeholder="Digite somente os números"
                        maxlength="18"
                        required
                    >

                    <small id="ajudaDocumento">
                        Informe um CPF válido.
                    </small>
                </div>

                <div class="grupo-campo">
                    <label for="nomeCliente">
                        Nome do cliente ou empreendimento
                    </label>

                    <input
                        type="text"
                        id="nomeCliente"
                        autocomplete="off"
                        placeholder="Ex.: Cabanas do Platô"
                        maxlength="100"
                        required
                    >
                </div>

                <div
                    id="mensagemFormulario"
                    class="mensagem-formulario escondido"
                ></div>

                <div class="acoes-formulario">

                    <button
                        id="botaoCancelarCliente"
                        class="botao-secundario"
                        type="button"
                    >
                        Cancelar
                    </button>

                    <button
                        class="botao-principal"
                        type="submit"
                    >
                        Salvar cliente
                    </button>

                </div>

            </form>

        </section>

        <footer>
            <strong>Ekoo Sys Engenharia</strong>
            <span>Versão 1.1</span>
        </footer>

    </main>

    <div id="modalExclusao" class="modal escondido">

        <div class="conteudo-modal">

            <div class="icone-modal">⚠️</div>

            <h2>Excluir cliente?</h2>

            <p id="textoExclusao">
                Esta ação não poderá ser desfeita.
            </p>

            <div class="acoes-modal">

                <button
                    id="cancelarExclusao"
                    class="botao-secundario"
                    type="button"
                >
                    Cancelar
                </button>

                <button
                    id="confirmarExclusao"
                    class="botao-excluir"
                    type="button"
                >
                    Excluir
                </button>

            </div>

        </div>

    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>

<script src="js/banco.js"></script>
<script src="js/script.js"></script>
<script src="js/etas.js"></script>
<script src="js/pontos.js"></script>
<script src="js/medicoes.js"></script>
<script src="js/historico.js"></script>
<script src="js/relatorios.js"></script>

</body>
</html>
